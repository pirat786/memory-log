[package]
name = "memory-log"
version.workspace = true
edition.workspace = true
build = "build.rs"

[features]
google-sync-release = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ml-core.workspace = true
ml-storage.workspace = true
ml-collector.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate", "zstd"] }
zstd = { version = "0.13", features = ["zstdmt"] }
tar = "0.4"
walkdir = "2.5"
sysinfo.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["bzip2", "deflate", "ppmd", "lz4", "zstd"] }
unrar = "0.5.8"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
windows = { workspace = true, features = [
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
