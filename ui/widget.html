<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Memory Log Widget</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(rgba(255, 255, 255, .96), rgba(22, 28, 43, .96));
      --surface: light-dark(#f0f3fa, #212a40);
      --text: light-dark(#1a2340, #eff2fb);
      --muted: light-dark(#56637f, #a7b3ce);
      --accent: #6669e4;
      --good: #76d9a9;
      --line: light-dark(#dce2f0, #34415e);
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    .edge-tab {
      width: 14px;
      height: 64px;
      margin: 2px 0 2px 2px;
      border-radius: 10px 0 0 10px;
      border: 1px solid rgba(102, 105, 228, .7);
      border-right: 0;
      background: linear-gradient(180deg, rgba(102, 105, 228, .9), rgba(34, 41, 68, .95));
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }
    .edge-grip { width: 3px; height: 24px; border-radius: 2px; background: rgba(255, 255, 255, .85); }
    .edge-dot {
      position: absolute;
      bottom: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
    }
    .edge-dot.awake { background: #fbbf24; }
    .edge-dot.paused { background: #f87171; }
    .edge-dot.timer {
      background: #818cf8;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: .65; }
    }
    .panel {
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      margin: 4px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .38);
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
    }
    [hidden] { display: none !important; }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .head strong { font-size: 13px; }
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface);
    }
    .seg button {
      padding: 5px 4px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: 600 11.5px/1.2 inherit;
      cursor: pointer;
    }
    .seg button.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
    }
    .tab-pane { display: grid; gap: 8px; align-content: start; min-height: 0; }
    .timer-display {
      text-align: center;
      font: 700 32px/1.1 "Segoe UI Variable Display", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      padding: 10px 0 4px;
    }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .act {
      padding: 9px 8px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font: 600 12px/1.2 inherit;
      cursor: pointer;
      text-align: center;
    }
    .act:hover { border-color: var(--accent); }
    .act.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .span2 { grid-column: 1 / -1; }
    .timer-row { display: flex; align-items: center; gap: 6px; }
    .timer-row input, .timer-row select {
      padding: 6px 8px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .timer-row input { width: 64px; text-align: center; user-select: text; }
    .timer-row select { flex: 1; min-width: 0; }
    .drop-zone {
      border: 1.5px dashed var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      transition: border-color .15s, background .15s, color .15s;
    }
    .drop-zone.over {
      border-color: var(--accent);
      background: rgba(102, 105, 228, .12);
      color: var(--text);
    }
    .drop-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--surface);
      font-size: 11.5px;
    }
    .drop-result span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drop-result button {
      padding: 3px 8px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: 600 11px/1.2 inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .drop-result button:hover { border-color: var(--accent); }
    .drop-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .drop-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .12s linear;
    }
  </style>
</head>
<body>
  <div id="edgeTab" class="edge-tab" data-i18n-title="widget.edge_title" title="Наведи или Ctrl+Alt+Space">
    <div class="edge-grip"></div>
    <span id="dot" class="edge-dot"></span>
  </div>

  <div id="panel" class="panel" hidden>
    <div class="head">
      <strong>Memory Log</strong>
      <button id="collapse" class="icon-btn" type="button" data-i18n-title="widget.collapse" title="Свернуть (Esc)">×</button>
    </div>

    <div class="seg">
      <button type="button" data-wt="timer" class="active" data-i18n="widget.tab.timer">Таймер</button>
      <button type="button" data-wt="files" data-i18n="widget.tab.files">Файлы</button>
      <button type="button" data-wt="ctrl" data-i18n="widget.tab.ctrl">Пульт</button>
    </div>

    <div id="pane-timer" class="tab-pane">
      <div id="timerClock" class="timer-display">25:00</div>
      <div class="grid3">
        <button class="act" type="button" data-mins="5" data-i18n="widget.timer.min5">5 мин</button>
        <button class="act" type="button" data-mins="15" data-i18n="widget.timer.min15">15 мин</button>
        <button class="act" type="button" data-mins="25" data-i18n="widget.timer.min25">25 мин</button>
      </div>
      <div class="timer-row">
        <input id="timerMins" type="number" min="1" max="180" value="25" data-i18n-title="widget.timer.custom_title" title="Своё время (мин)">
        <select id="timerSound" data-i18n-title="widget.timer.sound_title" title="Звук таймера">
          <option value="bell" data-i18n="widget.timer.sound.bell">Колокольчик</option>
          <option value="beep" data-i18n="widget.timer.sound.beep">Двойной сигнал</option>
          <option value="soft" data-i18n="widget.timer.sound.soft">Мягкий тон</option>
          <option value="none" data-i18n="widget.timer.sound.none">Без звука</option>
        </select>
      </div>
      <div class="grid2">
        <button id="timerToggle" class="act" type="button" data-i18n="widget.timer.start">Старт</button>
        <button id="timerReset" class="act" type="button" data-i18n="widget.timer.reset">Сброс</button>
      </div>
    </div>

    <div id="pane-files" class="tab-pane" hidden>
      <div class="timer-row">
        <select id="dropMode">
          <option value="auto" data-i18n="widget.files.mode_auto">Авто (Фото / ZIP)</option>
          <option value="compress" data-i18n="widget.files.mode_compress">Фото: сжать + без EXIF</option>
          <option value="webp" data-i18n="widget.files.mode_webp">Фото → WebP</option>
          <option value="jpg" data-i18n="widget.files.mode_jpg">Фото → JPG</option>
          <option value="strip" data-i18n="widget.files.mode_strip">Фото: убрать EXIF</option>
          <option value="zip" data-i18n="widget.files.mode_zip">Упаковать в ZIP</option>
        </select>
        <select id="dropMaxDim" style="flex:0 0 98px">
          <option value="1920" data-i18n="widget.files.dim_1920">≤ 1920px</option>
          <option value="2560" data-i18n="widget.files.dim_2560">≤ 2560px</option>
          <option value="0" data-i18n="widget.files.dim_0">Оригинал</option>
        </select>
        <select id="dropZipMode" style="flex:0 0 112px" hidden>
          <option value="fast" data-i18n="widget.files.zip_fast">Быстро (L1)</option>
          <option value="store" data-i18n="widget.files.zip_store">Без сжатия</option>
          <option value="normal" data-i18n="widget.files.zip_normal">Обычный (L6)</option>
        </select>
      </div>
      <div id="dropZone" class="drop-zone" data-i18n="widget.files.drop_hint">Перетащи фото, файлы или ZIP сюда</div>
      <div id="dropBar" class="drop-bar" hidden><div id="dropFill" class="drop-fill"></div></div>
      <div id="dropResult" class="drop-result" hidden>
        <span id="dropSummary"></span>
        <button id="dropCancel" type="button" data-i18n="widget.files.cancel" hidden>Отмена</button>
        <button id="dropReveal" type="button" data-i18n="widget.files.reveal" hidden>Папка</button>
      </div>
    </div>

    <div id="pane-ctrl" class="tab-pane" hidden>
      <div class="grid2">
        <button id="btnAwake" class="act" type="button" data-i18n="widget.ctrl.awake">Не спать</button>
        <button id="btnPause" class="act" type="button" data-i18n="widget.ctrl.pause">Пауза записи</button>
        <button id="btnPass" class="act span2" type="button" data-i18n="widget.ctrl.pass">Сгенерировать пароль (в буфер)</button>
        <button id="btnOpen" class="act span2" type="button" data-i18n="widget.ctrl.open">Открыть Memory Log</button>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = (id) => document.getElementById(id);
    const t = (key, params) => (window.I18N ? window.I18N.t(key, params) : key);

    let expanded = false;
    let hoverTimer = null;
    let leaveTimer = null;
    let pollTimer = null;
    let isAwake = false;
    let isPaused = false;
    let dragActive = false;
    let dropBusy = false;
    let lastDropPath = "";
    let dropStartedAt = 0;
    let dropProgress = { done: 0, total: 0, pct: 0 };
    let dropTimer = null;

    let timerSecs = 25 * 60;
    let timerInit = 25 * 60;
    let timerRunning = false;
    let timerEndAt = null;
    let audioCtx = null;

    function updateEdgeDot() {
      const dot = $("dot");
      dot.classList.toggle("paused", isPaused);
      dot.classList.toggle("awake", !isPaused && isAwake);
      dot.classList.toggle("timer", !isPaused && !isAwake && timerRunning);
    }

    function schedulePoll() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(refreshState, expanded ? 5000 : 30000);
    }

    async function setExpanded(next) {
      clearTimeout(hoverTimer);
      clearTimeout(leaveTimer);
      if (expanded === next) return;
      expanded = next;
      $("edgeTab").hidden = expanded;
      $("panel").hidden = !expanded;
      await invoke("widget_resize", { expanded });
      if (expanded) {
        refreshState();
      } else {
        schedulePoll();
      }
    }

    $("edgeTab").addEventListener("mouseenter", () => {
      hoverTimer = setTimeout(() => setExpanded(true), 120);
    });
    $("edgeTab").addEventListener("mouseleave", () => clearTimeout(hoverTimer));
    $("edgeTab").addEventListener("click", () => setExpanded(true));

    $("panel").addEventListener("mouseenter", () => clearTimeout(leaveTimer));
    $("panel").addEventListener("mouseleave", () => {
      if (dragActive || dropBusy || document.activeElement === $("timerMins")) return;
      leaveTimer = setTimeout(() => setExpanded(false), 450);
    });
    $("collapse").onclick = () => setExpanded(false);

    listen("widget-toggle", () => setExpanded(!expanded));
    listen("widget-expand", () => setExpanded(true));
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") setExpanded(false);
    });

    function switchTab(id) {
      for (const b of document.querySelectorAll(".seg button")) b.classList.toggle("active", b.dataset.wt === id);
      for (const paneId of ["timer", "files", "ctrl"]) $("pane-" + paneId).hidden = paneId !== id;
    }

    for (const btn of document.querySelectorAll(".seg button")) {
      btn.onclick = () => switchTab(btn.dataset.wt);
    }

    $("timerSound").value = localStorage.getItem("timerSound") || "bell";

    function getAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx || audioCtx.state === "closed") audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playTimerSound(kind = $("timerSound").value) {
      if (kind === "none") return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const tone = (freq, start, dur, type = "sine", gainVal = 0.22) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
          gain.gain.setValueAtTime(0.001, ctx.currentTime + start);
          gain.gain.exponentialRampToValueAtTime(gainVal, ctx.currentTime + start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + dur + 0.02);
        };
        if (kind === "bell") {
          tone(880, 0, 0.35, "sine", 0.2);
          tone(1320, 0.14, 0.45, "sine", 0.18);
        } else if (kind === "beep") {
          tone(740, 0, 0.14, "triangle", 0.22);
          tone(740, 0.2, 0.14, "triangle", 0.22);
        } else if (kind === "soft") {
          tone(528, 0, 0.65, "sine", 0.18);
        }
      } catch {}
    }

    $("timerSound").onchange = () => {
      localStorage.setItem("timerSound", $("timerSound").value);
      playTimerSound($("timerSound").value);
    };

    function drawTimer() {
      const m = String(Math.floor(timerSecs / 60)).padStart(2, "0");
      const s = String(timerSecs % 60).padStart(2, "0");
      $("timerClock").textContent = `${m}:${s}`;
      $("timerToggle").textContent = t(timerRunning ? "widget.timer.pause" : "widget.timer.start");
      $("timerToggle").classList.toggle("on", timerRunning);
      updateEdgeDot();
    }

    setInterval(() => {
      if (!timerRunning || timerEndAt === null) return;
      const left = Math.max(0, Math.ceil((timerEndAt - Date.now()) / 1000));
      if (left > 0) {
        if (left !== timerSecs) {
          timerSecs = left;
          drawTimer();
        }
      } else {
        timerSecs = 0;
        timerRunning = false;
        timerEndAt = null;
        drawTimer();
        playTimerSound();
        setExpanded(true);
        document.querySelector('[data-wt="timer"]').click();
        $("timerClock").textContent = t("widget.timer.done");
      }
    }, 250);

    for (const btn of document.querySelectorAll("[data-mins]")) {
      btn.onclick = () => {
        const mins = Number(btn.dataset.mins);
        $("timerMins").value = String(mins);
        timerInit = mins * 60;
        timerSecs = timerInit;
        timerRunning = true;
        timerEndAt = Date.now() + timerSecs * 1000;
        drawTimer();
      };
    }
    $("timerMins").onchange = () => {
      const mins = Math.max(1, Math.min(180, Math.round(Number($("timerMins").value) || 1)));
      $("timerMins").value = String(mins);
      timerInit = mins * 60;
      timerSecs = timerInit;
      timerRunning = false;
      timerEndAt = null;
      drawTimer();
    };
    $("timerToggle").onclick = () => {
      if (timerSecs === 0) timerSecs = timerInit;
      timerRunning = !timerRunning;
      timerEndAt = timerRunning ? Date.now() + timerSecs * 1000 : null;
      drawTimer();
    };
    $("timerReset").onclick = () => {
      timerRunning = false;
      timerEndAt = null;
      timerSecs = timerInit;
      drawTimer();
    };

    async function refreshState() {
      try {
        const [power, status] = await Promise.all([invoke("power_status"), invoke("status")]);
        isAwake = Boolean(power.keep_awake);
        isPaused = Boolean(status.paused);
        $("btnAwake").classList.toggle("on", isAwake);
        $("btnPause").classList.toggle("on", isPaused);
        $("btnPause").textContent = t(isPaused ? "widget.ctrl.resume" : "widget.ctrl.pause");
        updateEdgeDot();
      } catch {}
      schedulePoll();
    }

    $("btnAwake").onclick = async () => {
      await invoke("set_keep_awake", { enabled: !$("btnAwake").classList.contains("on") });
      await refreshState();
    };
    $("btnPause").onclick = async () => {
      await invoke("set_paused", { paused: !$("btnPause").classList.contains("on") });
      await refreshState();
    };
    $("btnPass").onclick = async () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
      const arr = new Uint32Array(16);
      crypto.getRandomValues(arr);
      const pwd = Array.from(arr, (n) => chars[n % chars.length]).join("");
      await navigator.clipboard.writeText(pwd);
      $("btnPass").textContent = t("widget.ctrl.copied");
      setTimeout(() => { $("btnPass").textContent = t("widget.ctrl.pass"); }, 1500);
    };
    $("btnOpen").onclick = () => invoke("open_main_window");

    function fmtBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
      if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
      return `${(n / 1073741824).toFixed(2)} GB`;
    }

    listen("tauri://drag-enter", () => {
      dragActive = true;
      setExpanded(true);
      switchTab("files");
      $("dropZone").classList.add("over");
    });
    listen("tauri://drag-leave", () => {
      dragActive = false;
      $("dropZone").classList.remove("over");
    });
    function fmtElapsed(ms) {
      if (ms < 1000) return `${ms} ms`;
      const secs = ms / 1000;
      if (secs < 60) return `${secs.toFixed(1)} s`;
      const m = Math.floor(secs / 60);
      const s = String(Math.floor(secs % 60)).padStart(2, "0");
      return `${m}:${s}`;
    }

    function renderDropProgress() {
      if (!dropBusy) return;
      const elapsedMs = Date.now() - dropStartedAt;
      const elapsed = fmtElapsed(elapsedMs);
      const { done, total, pct } = dropProgress;
      $("dropFill").style.width = `${pct}%`;
      if (total > 0) {
        let eta = "";
        if (done > 0 && done < total && elapsedMs >= 500) {
          const etaMs = Math.round(((total - done) / done) * elapsedMs);
          eta = ` (~${fmtElapsed(etaMs)})`;
        }
        $("dropSummary").textContent = `${pct}% • ${elapsed}${eta} • ${fmtBytes(done)}/${fmtBytes(total)}`;
      } else {
        $("dropSummary").textContent = `${t("widget.files.processing")} ${elapsed}`;
      }
    }

    function restoreSelect(id, key, fallback) {
      const el = $(id);
      const saved = localStorage.getItem(key);
      if (saved && [...el.options].some((o) => o.value === saved)) {
        el.value = saved;
      } else {
        el.value = fallback;
      }
    }

    function syncDropControls() {
      const m = $("dropMode").value;
      $("dropZipMode").hidden = m !== "zip";
      $("dropMaxDim").hidden = m === "zip" || m === "strip";
    }

    restoreSelect("dropMode", "widgetDropMode", "auto");
    restoreSelect("dropMaxDim", "widgetDropMaxDim", "1920");
    restoreSelect("dropZipMode", "widgetDropZipMode", "fast");

    $("dropMode").onchange = () => {
      localStorage.setItem("widgetDropMode", $("dropMode").value);
      syncDropControls();
    };
    $("dropMaxDim").onchange = () => {
      localStorage.setItem("widgetDropMaxDim", $("dropMaxDim").value);
    };
    $("dropZipMode").onchange = () => {
      localStorage.setItem("widgetDropZipMode", $("dropZipMode").value);
    };
    syncDropControls();

    listen("quick-drop-progress", (e) => {
      if (!dropBusy || !e?.payload) return;
      dropProgress = e.payload;
      renderDropProgress();
    });

    listen("tauri://drag-drop", async (e) => {
      dragActive = false;
      $("dropZone").classList.remove("over");
      const paths = e?.payload?.paths;
      if (!Array.isArray(paths) || !paths.length || dropBusy) return;
      dropBusy = true;
      dropStartedAt = Date.now();
      dropProgress = { done: 0, total: 0, pct: 0 };
      clearInterval(dropTimer);
      dropTimer = setInterval(renderDropProgress, 250);
      $("dropZone").textContent = t("widget.files.processing");
      $("dropFill").style.width = "0%";
      $("dropBar").hidden = false;
      renderDropProgress();
      $("dropReveal").hidden = true;
      $("dropCancel").disabled = false;
      $("dropCancel").textContent = t("widget.files.cancel");
      $("dropCancel").hidden = false;
      $("dropResult").hidden = false;
      try {
        const rep = await invoke("quick_drop", {
          paths,
          mode: $("dropMode").value,
          maxDim: Number($("dropMaxDim").value) || 0,
          quality: 82,
          zipMode: $("dropZipMode").value,
        });
        lastDropPath = rep.output_path;
        const pct = rep.input_bytes > 0
          ? Math.round((1 - rep.output_bytes / rep.input_bytes) * 100)
          : 0;
        const delta = rep.kind === "zip-unpack"
          ? `${rep.count} f`
          : `${fmtBytes(rep.input_bytes)} → ${fmtBytes(rep.output_bytes)} (${pct >= 0 ? `-${pct}%` : `+${-pct}%`})`;
        $("dropSummary").textContent = `${delta} • ${fmtElapsed(rep.elapsed_ms)}`;
        $("dropReveal").hidden = false;
      } catch (err) {
        const msg = String(err);
        $("dropSummary").textContent = msg.includes("отменено")
          ? `${t("widget.files.cancelled")} (${fmtElapsed(Date.now() - dropStartedAt)})`
          : msg;
        $("dropReveal").hidden = true;
      } finally {
        dropBusy = false;
        clearInterval(dropTimer);
        $("dropBar").hidden = true;
        $("dropCancel").hidden = true;
        $("dropZone").textContent = t("widget.files.drop_hint");
      }
    });
    $("dropCancel").onclick = async () => {
      if (!dropBusy) return;
      $("dropCancel").disabled = true;
      $("dropCancel").textContent = t("widget.files.cancelling");
      await invoke("quick_drop_cancel");
    };
    $("dropReveal").onclick = () => {
      if (lastDropPath) invoke("reveal_path", { path: lastDropPath });
    };

    (async () => {
      try { await window.I18N?.init(); } catch {}
      drawTimer();
      refreshState();
    })();
  </script>
</body>
</html>
