<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Memory Log Widget</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(rgba(255, 255, 255, .96), rgba(22, 28, 43, .96));
      --surface: light-dark(#f0f3fa, #212a40);
      --text: light-dark(#1a2340, #eff2fb);
      --muted: light-dark(#56637f, #a7b3ce);
      --accent: #6669e4;
      --good: #76d9a9;
      --line: light-dark(#dce2f0, #34415e);
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    .edge-tab {
      width: 14px;
      height: 64px;
      margin: 2px 0 2px 2px;
      border-radius: 10px 0 0 10px;
      border: 1px solid rgba(102, 105, 228, .7);
      border-right: 0;
      background: linear-gradient(180deg, rgba(102, 105, 228, .9), rgba(34, 41, 68, .95));
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }
    .edge-grip { width: 3px; height: 24px; border-radius: 2px; background: rgba(255, 255, 255, .85); }
    .edge-dot {
      position: absolute;
      bottom: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
    }
    .edge-dot.awake { background: #fbbf24; }
    .edge-dot.paused { background: #f87171; }
    .edge-dot.timer {
      background: #818cf8;
      animation: pulse-dot 1.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: .65; }
    }
    .panel {
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      margin: 4px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .38);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      overflow: hidden;
    }
    [hidden] { display: none !important; }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .head strong { font-size: 13px; }
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .seg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface);
    }
    .seg button {
      padding: 5px 4px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font: 600 11.5px/1.2 inherit;
      cursor: pointer;
    }
    .seg button.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
    }
    .tab-pane { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; min-height: 0; min-width: 0; }
    .timer-display {
      text-align: center;
      font: 700 32px/1.1 "Segoe UI Variable Display", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      padding: 10px 0 4px;
    }
    .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .act {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 8px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font: 600 11.5px/1.2 inherit;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: background .15s, border-color .15s, transform .08s;
    }
    .act:hover { border-color: var(--accent); }
    .act:active { transform: scale(.98); }
    .act.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .act-primary {
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      color: var(--accent);
    }
    .act-primary:hover {
      background: color-mix(in srgb, var(--accent) 18%, var(--surface));
      border-color: var(--accent);
    }
    .ctrl-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .act-ghost {
      padding: 6px 4px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font: 600 11px/1.2 inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, color .12s;
    }
    .act-ghost:hover { background: var(--bg); color: var(--accent); }
    .kbd {
      font: 600 9.5px/1 inherit;
      padding: 2px 4px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .span2 { grid-column: 1 / -1; }
    .timer-row { display: flex; align-items: center; gap: 6px; }
    .timer-row input, .timer-row select {
      padding: 6px 8px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .timer-row input { width: 64px; text-align: center; user-select: text; }
    .timer-row select { flex: 1; min-width: 0; }
    .drop-zone {
      border: 1.5px dashed var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      transition: border-color .15s, background .15s, color .15s;
    }
    .drop-zone.over {
      border-color: var(--accent);
      background: rgba(102, 105, 228, .12);
      color: var(--text);
    }
    .drop-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--surface);
      font-size: 11px;
      min-width: 0;
    }
    .drop-result span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drop-result button {
      padding: 3px 8px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: 600 11px/1.2 inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .drop-result button:hover { border-color: var(--accent); }
    .drop-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .drop-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .12s linear;
    }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .act-sm { padding: 6px 4px; font-size: 11px; }
    .ctrl-status {
      min-height: 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lock-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 76px;
      overflow-y: auto;
    }
    .lock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--surface);
      font-size: 11px;
    }
    .lock-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lock-row button {
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: 600 10.5px/1.2 inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lock-row button:hover { border-color: #d9534f; color: #d9534f; }
    .drop-zone.danger { border-color: rgba(217, 83, 79, .45); color: #d9534f; }
    .btn-danger { border-color: #d9534f !important; color: #d9534f !important; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="edgeTab" class="edge-tab" data-i18n-title="widget.edge_title" title="Наведи или Ctrl+Alt+Space">
    <div class="edge-grip"></div>
    <span id="dot" class="edge-dot"></span>
  </div>

  <div id="panel" class="panel" hidden>
    <div class="head">
      <strong>Memory Log</strong>
      <button id="collapse" class="icon-btn" type="button" data-i18n-title="widget.collapse" title="Свернуть (Esc)">×</button>
    </div>

    <div class="seg">
      <button type="button" data-wt="timer" class="active" data-i18n="widget.tab.timer">Таймер</button>
      <button type="button" data-wt="files" data-i18n="widget.tab.files">Файлы</button>
      <button type="button" data-wt="ctrl" data-i18n="widget.tab.ctrl">Пульт</button>
    </div>

    <div id="pane-timer" class="tab-pane">
      <div id="timerClock" class="timer-display">25:00</div>
      <div class="grid3">
        <button class="act" type="button" data-mins="5" data-i18n="widget.timer.min5">5 мин</button>
        <button class="act" type="button" data-mins="15" data-i18n="widget.timer.min15">15 мин</button>
        <button class="act" type="button" data-mins="25" data-i18n="widget.timer.min25">25 мин</button>
      </div>
      <div class="timer-row">
        <input id="timerMins" type="number" min="1" max="180" value="25" data-i18n-title="widget.timer.custom_title" title="Своё время (мин)">
        <select id="timerSound" data-i18n-title="widget.timer.sound_title" title="Звук таймера">
          <option value="bell" data-i18n="widget.timer.sound.bell">Колокольчик</option>
          <option value="beep" data-i18n="widget.timer.sound.beep">Двойной сигнал</option>
          <option value="soft" data-i18n="widget.timer.sound.soft">Мягкий тон</option>
          <option value="none" data-i18n="widget.timer.sound.none">Без звука</option>
        </select>
      </div>
      <div class="grid2">
        <button id="timerToggle" class="act" type="button" data-i18n="widget.timer.start">Старт</button>
        <button id="timerReset" class="act" type="button" data-i18n="widget.timer.reset">Сброс</button>
      </div>
    </div>

    <div id="pane-files" class="tab-pane" hidden>
      <div class="timer-row">
        <select id="dropMode">
          <option value="auto" data-i18n="widget.files.mode_auto">Авто (Фото / ZIP)</option>
          <option value="jpg" data-i18n="widget.files.mode_jpg">Фото → JPG</option>
          <option value="zip" data-i18n="widget.files.mode_zip">Упаковать в ZIP</option>
          <option value="locks" data-i18n="widget.files.mode_locks">Кто держит файл?</option>
          <option value="delete" data-i18n="widget.files.mode_delete">Удалить мимо корзины</option>
        </select>
        <select id="dropMaxDim" style="flex:0 0 98px">
          <option value="1920" data-i18n="widget.files.dim_1920">≤ 1920px</option>
          <option value="2560" data-i18n="widget.files.dim_2560">≤ 2560px</option>
          <option value="0" data-i18n="widget.files.dim_0">Оригинал</option>
        </select>
        <select id="dropZipMode" style="flex:0 0 112px" hidden>
          <option value="fast" data-i18n="widget.files.zip_fast">Быстро (L1)</option>
          <option value="store" data-i18n="widget.files.zip_store">Без сжатия</option>
          <option value="normal" data-i18n="widget.files.zip_normal">Обычный (L6)</option>
        </select>
      </div>
      <div id="dropZone" class="drop-zone" data-i18n="widget.files.drop_hint">Перетащи фото, файлы или ZIP сюда</div>
      <div id="dropBar" class="drop-bar" hidden><div id="dropFill" class="drop-fill"></div></div>
      <div id="dropResult" class="drop-result" hidden>
        <span id="dropSummary"></span>
        <button id="dropCancel" type="button" data-i18n="widget.files.cancel" hidden>Отмена</button>
        <button id="dropReveal" type="button" data-i18n="widget.files.reveal" hidden>Папка</button>
      </div>
      <div id="lockList" class="lock-list" hidden></div>
    </div>

    <div id="pane-ctrl" class="tab-pane" hidden>
      <div class="grid2">
        <button id="btnAwake" class="act" type="button" data-i18n="widget.ctrl.awake">Не спать</button>
        <button id="btnPause" class="act" type="button" data-i18n="widget.ctrl.pause">Пауза записи</button>
      </div>
      <div class="grid2">
        <button id="btnLayout" class="act" type="button"><span data-i18n="widget.ctrl.fix_layout">Раскладка</span><span class="kbd">Ctrl+Alt+R</span></button>
        <button id="btnPass" class="act" type="button" data-i18n="widget.ctrl.pass">Пароль в буфер</button>
      </div>
      <div class="grid2">
        <button id="btnExplorer" class="act" type="button" data-i18n="widget.ctrl.restart_explorer">Рестарт Explorer</button>
        <button id="btnDns" class="act" type="button" data-i18n="widget.ctrl.flush_dns">Сброс DNS</button>
      </div>
      <div class="ctrl-group">
        <button class="act-ghost" type="button" data-qpath="temp">Temp</button>
        <button class="act-ghost" type="button" data-qpath="appdata">AppData</button>
        <button class="act-ghost" type="button" data-qpath="hosts">hosts</button>
      </div>
      <button id="btnOpen" class="act act-primary span2" type="button" data-i18n="widget.ctrl.open">Открыть Memory Log</button>
      <div id="ctrlStatus" class="ctrl-status"></div>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
