<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Memory Log Widget</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(rgba(255, 255, 255, .96), rgba(22, 28, 43, .96));
      --surface: light-dark(#f0f3fa, #212a40);
      --text: light-dark(#1a2340, #eff2fb);
      --muted: light-dark(#56637f, #a7b3ce);
      --accent: #6669e4;
      --good: #76d9a9;
      --line: light-dark(#dce2f0, #34415e);
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    .edge-tab {
      width: 14px;
      height: 64px;
      margin: 2px 0 2px 2px;
      border-radius: 10px 0 0 10px;
      border: 1px solid rgba(102, 105, 228, .7);
      border-right: 0;
      background: linear-gradient(180deg, rgba(102, 105, 228, .9), rgba(34, 41, 68, .95));
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }
    .edge-grip { width: 3px; height: 24px; border-radius: 2px; background: rgba(255, 255, 255, .85); }
    .edge-dot {
      position: absolute;
      bottom: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
    }
    .edge-dot.awake { background: #fbbf24; }
    .edge-dot.paused { background: #f87171; }
    .panel {
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      margin: 4px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .38);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      gap: 10px;
      overflow: hidden;
    }
    [hidden] { display: none !important; }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
    .head strong { font-size: 13px; white-space: nowrap; }
    .head-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .tab-pane { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; min-height: 0; min-width: 0; }
    .timer-row { display: flex; align-items: center; gap: 6px; }
    .timer-row input, .timer-row select {
      padding: 6px 8px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      outline: none;
    }
    .timer-row input { width: 64px; text-align: center; user-select: text; }
    .timer-row select { flex: 1; min-width: 0; }
    .drop-zone {
      border: 1.5px dashed var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 18px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      transition: border-color .15s, background .15s, color .15s;
    }
    .drop-zone.over {
      border-color: var(--accent);
      background: rgba(102, 105, 228, .12);
      color: var(--text);
    }
    .drop-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 9px;
      background: var(--surface);
      font-size: 11px;
      min-width: 0;
    }
    .drop-result span {
      flex: 1;
      min-width: 0;
      font-size: 10.5px;
      line-height: 1.3;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .drop-result button {
      padding: 3px 8px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: 600 11px/1.2 inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .drop-result button:hover { border-color: var(--accent); }
    .drop-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .drop-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .12s linear;
    }
    .lock-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 76px;
      overflow-y: auto;
    }
    .lock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--surface);
      font-size: 11px;
    }
    .lock-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lock-row button {
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font: 600 10.5px/1.2 inherit;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lock-row button:hover { border-color: #d9534f; color: #d9534f; }
    .drop-zone.danger { border-color: rgba(217, 83, 79, .45); color: #d9534f; }
    .btn-danger { border-color: #d9534f !important; color: #d9534f !important; }
    .drop-opt {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 2px;
    }
    .drop-opt input { margin: 0; accent-color: var(--accent); cursor: pointer; }
    .drop-opt:has(input:checked) { color: #d9534f; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="edgeTab" class="edge-tab" data-i18n-title="widget.edge_title" title="Наведи или Ctrl+Alt+Space">
    <div class="edge-grip"></div>
    <span id="dot" class="edge-dot"></span>
  </div>

  <div id="panel" class="panel" hidden>
    <div class="head">
      <strong>Memory Log</strong>
      <div class="head-actions">
        <button id="petToggle" class="icon-btn" type="button" title="Котик на рабочем столе">🐾</button>
        <button id="collapse" class="icon-btn" type="button" data-i18n-title="widget.collapse" title="Свернуть (Esc)">×</button>
      </div>
    </div>

    <div id="pane-files" class="tab-pane">
      <div class="timer-row">
        <select id="dropMode">
          <option value="auto" data-i18n="widget.files.mode_auto">Авто (Фото / ZIP)</option>
          <option value="jpg" data-i18n="widget.files.mode_jpg">Фото → JPG</option>
          <option value="zip" data-i18n="widget.files.mode_zip">Упаковать в ZIP</option>
          <option value="locks" data-i18n="widget.files.mode_locks">Кто держит файл?</option>
          <option value="delete" data-i18n="widget.files.mode_delete">Удалить мимо корзины</option>
        </select>
        <select id="dropMaxDim" style="flex:0 0 98px">
          <option value="1920" data-i18n="widget.files.dim_1920">≤ 1920px</option>
          <option value="2560" data-i18n="widget.files.dim_2560">≤ 2560px</option>
          <option value="0" data-i18n="widget.files.dim_0">Оригинал</option>
        </select>
        <select id="dropZipMode" style="flex:0 0 122px" hidden>
          <option value="fast" data-i18n="widget.files.zip_fast">Быстрая упаковка</option>
          <option value="max" data-i18n="widget.files.zip_max">Сильное сжатие (ZIP)</option>
          <option value="solid" data-i18n="widget.files.zip_solid">Макс. сжатие (.tar.zst)</option>
        </select>
      </div>
      <label id="dropDeleteAfterRow" class="drop-opt">
        <input id="dropDeleteAfter" type="checkbox">
        <span data-i18n="widget.files.delete_after_zip">Удалять оригинал после архива</span>
      </label>
      <div id="dropZone" class="drop-zone" data-i18n="widget.files.drop_hint">Перетащи фото, файлы или ZIP сюда</div>
      <div id="dropBar" class="drop-bar" hidden><div id="dropFill" class="drop-fill"></div></div>
      <div id="dropResult" class="drop-result" hidden>
        <span id="dropSummary"></span>
        <button id="dropCancel" type="button" data-i18n="widget.files.cancel" hidden>Отмена</button>
        <button id="dropReveal" type="button" data-i18n="widget.files.reveal" hidden>Папка</button>
      </div>
      <div id="lockList" class="lock-list" hidden></div>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
