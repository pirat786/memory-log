<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Memory Log Pet</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2px;
    }
    .cat {
      position: relative;
      width: 44px;
      height: 36px;
      cursor: pointer;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .45));
      transition: transform .15s ease;
    }
    .cat.hop { transform: translateY(-6px); }
    .cat svg { display: block; width: 44px; height: 36px; transition: transform .12s; }
    .cat.flip svg { transform: scaleX(-1); }
    .cat.walk svg { animation: walk-bob .65s ease-in-out infinite; }
    .cat.flip.walk svg { animation: walk-bob-flip .65s ease-in-out infinite; }
    @keyframes walk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes walk-bob-flip { 0%, 100% { transform: scaleX(-1) translateY(0); } 50% { transform: scaleX(-1) translateY(-1.5px); } }
    .zzz {
      position: absolute;
      top: -8px;
      right: -2px;
      font: 700 10px/1 sans-serif;
      color: #818cf8;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      opacity: 0;
      pointer-events: none;
    }
    .cat.sleep .zzz { animation: sleep-float 1.6s ease-in-out infinite; }
    @keyframes sleep-float {
      0%, 100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
    .bubble {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 7px;
      border-radius: 7px;
      background: rgba(24, 27, 36, .94);
      color: #f4f6fb;
      border: 1px solid rgba(255, 255, 255, .18);
      font-size: 10.5px;
      line-height: 1.25;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
    }
    .bubble.show { opacity: 1; }
    .busy-tag {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font: 700 9.5px/1 sans-serif;
      color: #38bdf8;
      text-shadow: 0 1px 3px rgba(0,0,0,.75);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
    }
    .cat.busy .busy-tag { opacity: 1; }
    .cat:has(.bubble.show) .busy-tag { opacity: 0; }
  </style>
</head>
<body>
  <div class="stage">
    <div id="cat" class="cat" title="Мяу!">
      <span id="bubble" class="bubble"></span>
      <span id="busyTag" class="busy-tag"></span>
      <span class="zzz">zZ</span>
      <svg viewBox="0 0 44 36" aria-hidden="true">
        <path d="M9 24 C3 24, 2 15, 7 13" fill="none" stroke="#1e2230" stroke-width="4" stroke-linecap="round"/>
        <path d="M9 24 C3 24, 2 15, 7 13" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
        <rect x="9" y="16" width="22" height="14" rx="7" fill="#1e2230" stroke="#818cf8" stroke-width="1.5"/>
        <rect x="12" y="27" width="4" height="6" rx="2" fill="#1e2230" stroke="#818cf8" stroke-width="1.2"/>
        <rect x="24" y="27" width="4" height="6" rx="2" fill="#1e2230" stroke="#818cf8" stroke-width="1.2"/>
        <path d="M22 14 L23 5 L28 10 L33 10 L38 5 L39 14 C40 18, 37 22, 31 22 C24 22, 21 18, 22 14 Z"
              fill="#1e2230" stroke="#818cf8" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="28" cy="15" r="1.6" fill="#38bdf8"/>
        <circle cx="35" cy="15" r="1.6" fill="#38bdf8"/>
        <circle cx="32" cy="17.5" r="1" fill="#f472b6"/>
      </svg>
    </div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const cat = document.getElementById("cat");
    const bubble = document.getElementById("bubble");
    const busyTag = document.getElementById("busyTag");
    const PHRASES = ["мяу!", "мур~", "работаем", "всё ок", "чай?"];

    let bounds = [0, 800, 500];
    let x = 200;
    let dir = 1;
    let pauseTicks = 0;
    let isPaused = false;
    let isAwake = false;
    let isBusy = false;
    let busyPct = 0;
    let busyTimer = null;
    let bubbleTimer = null;

    function showBubble(msg, ms = 1300) {
      bubble.textContent = msg;
      bubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), ms);
    }

    listen("quick-drop-progress", (e) => {
      const pct = Number(e?.payload?.pct ?? 0);
      if (pct >= 100) {
        isBusy = false;
        cat.classList.remove("busy");
        showBubble("готово!", 1200);
        return;
      }
      isBusy = true;
      busyPct = pct;
      busyTag.textContent = `⚡ ${pct}%`;
      pauseTicks = 0;
      cat.classList.add("busy");
      clearTimeout(busyTimer);
      busyTimer = setTimeout(() => {
        isBusy = false;
        cat.classList.remove("busy");
      }, 1500);
    });

    let lastSentX = null;
    let lastSentY = null;

    async function syncState() {
      if (document.hidden) return;
      try {
        const [b, power, status] = await Promise.all([
          invoke("pet_bounds"),
          invoke("power_status"),
          invoke("status"),
        ]);
        bounds = b;
        isAwake = Boolean(power.keep_awake);
        isPaused = Boolean(status.paused);
      } catch {}
    }

    setInterval(syncState, 5000);
    syncState().then(() => {
      x = Math.round((bounds[0] + bounds[1]) / 2);
      lastSentX = x;
      lastSentY = bounds[2];
      invoke("pet_move", { x, y: bounds[2] });
    });

    setInterval(() => {
      if (document.hidden) return;
      const [minX, maxX, y] = bounds;
      if (isPaused && !isBusy) {
        cat.classList.remove("walk");
        cat.classList.add("sleep");
        return;
      }
      cat.classList.remove("sleep");
      if (pauseTicks > 0 && !isBusy) {
        pauseTicks -= 1;
        cat.classList.remove("walk");
        return;
      }
      const step = isAwake ? 1.5 : 1;
      x += dir * step;
      if (x >= maxX) {
        x = maxX;
        dir = -1;
      } else if (x <= minX) {
        x = minX;
        dir = 1;
      } else if (!isAwake && !isBusy && Math.random() < 0.008) {
        pauseTicks = 45;
      }
      cat.classList.add("walk");
      cat.classList.toggle("flip", dir < 0);
      const rx = Math.round(x);
      if (rx !== lastSentX || y !== lastSentY) {
        lastSentX = rx;
        lastSentY = y;
        invoke("pet_move", { x: rx, y });
      }
    }, 40);

    cat.onclick = () => {
      cat.classList.add("hop");
      setTimeout(() => cat.classList.remove("hop"), 200);
      const msg = isBusy
        ? `вжух! ${busyPct}%`
        : isPaused
          ? "zZ…"
          : isAwake
            ? "☕ бодр!"
            : PHRASES[Math.floor(Math.random() * PHRASES.length)];
      showBubble(msg);
    };
  </script>
</body>
</html>
