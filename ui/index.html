<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav">
      <button id="prev" data-i18n-title="nav.prev">‹</button>
      <h1 id="date" data-i18n="nav.today"></h1>
      <button id="next" data-i18n-title="nav.next">›</button>
    </div>
    <div class="actions">
      <span id="status" class="status muted"></span>
      <select id="lang" aria-label="Language" data-i18n-title="lang.label"></select>
      <button id="mark" data-i18n="btn.mark"></button>
      <button id="pause" data-i18n="btn.pause"></button>
    </div>
  </header>

  <main>
    <section id="errorBox" class="error" hidden></section>

    <section class="hero">
      <div class="big" id="total">—</div>
      <div class="muted" data-i18n="hero.caption"></div>
      <div class="muted" id="rhythm"></div>
    </section>

    <section>
      <h2 data-i18n="hist.title"></h2>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="windows" data-i18n="hist.tab.windows"></button>
        <button class="tab" data-tab="clips" data-i18n="hist.tab.clips"></button>
        <button class="tab" data-tab="all" data-i18n="hist.tab.all"></button>
      </div>
      <input id="q" type="search" autocomplete="off">
      <div class="note-row"><div id="tabNote" class="muted small-text"></div><button id="clearClips" class="small" data-i18n="hist.clear" hidden></button></div>
      <div id="list" class="timeline"></div>
    </section>

    <section>
      <h2 data-i18n="sec.activity"></h2>
      <div id="categories" class="bars"></div>
      <h3 data-i18n="sec.goals"></h3>
      <div id="goals"></div>
      <button id="addGoal" class="small" data-i18n="goal.add"></button>
    </section>

    <section>
      <h2 data-i18n="sec.focus"></h2>
      <div id="focus"></div>
    </section>

    <section>
      <h2 data-i18n="sec.bookmarks"></h2>
      <div id="bookmarks"></div>
    </section>

    <section>
      <h2 data-i18n="sec.load"></h2>
      <div id="load" class="cards"></div>
    </section>

    <section>
      <h2 data-i18n="sec.net"></h2>
      <div id="net" class="cards"></div>
      <div id="hours" class="chart"></div>
      <div class="muted small-text" data-i18n="net.note"></div>
    </section>

    <section>
      <h2 data-i18n="sec.procs"></h2>
      <div id="procs"></div>
    </section>

    <section>
      <h2 data-i18n="sec.health"></h2>
      <div id="health"></div>
    </section>

    <section>
      <h2 data-i18n="sec.downloads"></h2>
      <div id="downloads"></div>
    </section>

    <section>
      <h2 data-i18n="sec.apps"></h2>
      <div id="apps" class="bars"></div>
    </section>

    <section>
      <h2 data-i18n="sec.week"></h2>
      <div id="week" class="bars"></div>
    </section>

    <section>
      <h2 data-i18n="sec.tools"></h2>
      <div class="tools">
        <button id="export" data-i18n="tools.export"></button>
        <button id="forget" data-i18n="tools.forget"></button>
        <label><input type="checkbox" id="autostart"> <span data-i18n="tools.autostart"></span></label>
      </div>
      <div id="toolMsg" class="muted"></div>
    </section>
  </main>

  <dialog id="noteDlg">
    <form method="dialog">
      <h3 data-i18n="note.title"></h3>
      <input id="noteText" type="text" data-i18n-placeholder="note.ph" autocomplete="off">
      <div class="row">
        <button value="cancel" data-i18n="common.cancel"></button>
        <button value="ok" class="primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="goalDlg">
    <form method="dialog">
      <h3 data-i18n="goaldlg.title"></h3>
      <select id="goalCat"></select>
      <input id="goalMin" type="number" min="0" step="5" data-i18n-placeholder="goaldlg.ph">
      <div class="row">
        <button value="cancel" data-i18n="common.cancel"></button>
        <button value="ok" class="primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
