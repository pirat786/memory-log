<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Log</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Memory Log</div>
      <nav class="views" data-i18n-label="view.label">
        <button type="button" data-view="day" aria-controls="dayView" aria-current="page">
          <span class="nav-icon icon-day" aria-hidden="true"></span><span data-i18n="view.day"></span>
        </button>
        <button type="button" data-view="history" aria-controls="historyView">
          <span class="nav-icon icon-history" aria-hidden="true"></span><span data-i18n="view.history"></span>
        </button>
        <button type="button" data-view="system" aria-controls="systemView">
          <span class="nav-icon icon-system" aria-hidden="true"></span><span data-i18n="view.system"></span>
        </button>
        <button type="button" data-view="settings" aria-controls="settingsView">
          <span class="nav-icon icon-settings" aria-hidden="true"></span><span data-i18n="view.settings"></span>
        </button>
      </nav>
    </aside>

    <main>
      <header class="page-header">
        <h1 id="pageTitle" tabindex="-1" data-i18n="view.day"></h1>
        <div class="actions">
          <span id="status" class="status" role="status"></span>
          <button id="syncIndicator" class="small" type="button" data-i18n="sync.indicator" hidden></button>
          <button id="updateIndicator" class="small" type="button" data-i18n="update.indicator" hidden></button>
          <button id="themeToggle" type="button" data-i18n="theme.toggle"></button>
          <button id="pause" data-i18n="btn.pause"></button>
          <button id="mark" class="primary" data-i18n="btn.mark"></button>
        </div>
      </header>
      <div class="nav-row">
        <div id="dateNav" class="date-nav">
          <button id="prev" type="button" data-i18n-label="nav.prev">‹</button>
          <button id="date" class="date-picker" type="button" aria-haspopup="dialog" data-i18n-title="calendar.title" data-i18n="nav.today"></button>
          <button id="next" type="button" data-i18n-label="nav.next">›</button>
        </div>
        <select id="deviceScope" class="device-scope" data-i18n-label="sync.filter" hidden></select>
      </div>
      <div id="errorBox" class="error" role="alert" hidden></div>
      <div id="breakReminder" class="break-reminder" role="status" hidden>
        <span id="breakReminderText"></span>
        <button id="dismissBreak" class="small" type="button" data-i18n="break.dismiss"></button>
      </div>

      <div id="dayView" class="view" aria-labelledby="pageTitle">
        <section id="allDevicesOverview" hidden aria-labelledby="allDevicesTitle">
          <h2 id="allDevicesTitle" data-i18n="sync.all"></h2>
          <div id="allDevicesRows"></div>
        </section>
        <section class="hero" aria-labelledby="dayTrackTitle">
          <h2 id="dayTrackTitle" data-i18n="track.title"></h2>
          <div class="activity-total">
            <div class="big" id="total">—</div>
            <div class="muted" data-i18n="hero.caption"></div>
            <div class="day-delta muted" id="dayDelta"></div>
          </div>
          <div class="muted" id="rhythm"></div>
          <div id="dayTrack" class="day-track" role="group" aria-labelledby="dayTrackTitle">
            <div id="trackSegments" class="track-segments"></div>
            <div id="trackBookmarks" class="track-bookmarks"></div>
          </div>
          <div id="trackHours" class="track-hours" aria-hidden="true"></div>
          <div id="trackLegend" class="track-legend"></div>
          <div id="trackSelection" class="range-filter track-selection" hidden>
            <span id="trackSelectionLabel"></span>
            <button id="openTrackWindow" type="button" data-i18n="search.open_window"></button>
          </div>
        </section>

        <div class="overview-grid">
          <section>
            <h2 data-i18n="sec.activity"></h2>
            <div id="categories" class="bars"></div>
          </section>
          <section>
            <div class="card-heading">
              <h2 data-i18n="sec.week"></h2>
              <button id="openComparison" class="small" type="button" data-i18n="compare.open"></button>
            </div>
            <div id="week"></div>
          </section>
          <section>
            <h2 data-i18n="sec.apps"></h2>
            <div id="apps" class="bars"></div>
          </section>
          <section data-section="focus">
            <h2 data-i18n="sec.focus"></h2>
            <div id="focus"></div>
          </section>
          <section data-section="sites">
            <h2 data-i18n="sec.sites"></h2>
            <div id="sites" class="bars"></div>
            <div class="muted small-text" data-i18n="sites.note"></div>
          </section>
          <section data-section="goals">
            <div class="card-heading">
              <h2 data-i18n="sec.goals"></h2>
              <button id="addGoal" class="small" data-i18n="goal.add"></button>
            </div>
            <div id="goals"></div>
          </section>
        </div>
        <section data-section="comparison">
          <h2 id="comparisonTitle" tabindex="-1" data-i18n="compare.title"></h2>
          <form id="workHours" class="setting-row compare-hours">
            <label><input id="workOnly" type="checkbox"> <span data-i18n="compare.work_only"></span></label>
            <div id="workTimes" class="setting-actions" hidden>
              <input id="workStart" type="time" value="09:00" data-i18n-label="compare.work_start" required>
              <input id="workEnd" type="time" value="18:00" data-i18n-label="compare.work_end" required>
              <button type="submit" data-i18n="common.save"></button>
            </div>
          </form>
          <p class="muted small-text" data-i18n="compare.note"></p>
          <div id="comparison"></div>
        </section>
      </div>

      <div id="historyView" class="view" aria-labelledby="pageTitle" hidden>
        <section class="history-panel">
          <div class="history-header">
            <div class="tabs" role="group" data-i18n-label="hist.title">
              <button class="tab active" data-tab="windows" aria-pressed="true" data-i18n="hist.tab.windows"></button>
              <button class="tab" data-tab="clips" aria-pressed="false" data-i18n="hist.tab.clips"></button>
              <button class="tab" data-tab="bookmarks" aria-pressed="false" data-i18n="sec.bookmarks"></button>
              <button class="tab" data-tab="downloads" aria-pressed="false" data-i18n="sec.downloads"></button>
              <button class="tab" data-tab="all" aria-pressed="false" data-i18n="hist.tab.all"></button>
            </div>
            <button id="export" class="small" data-i18n="tools.export"></button>
          </div>
          <div id="exportMsg" class="muted" role="status"></div>
          <div id="historyFilter">
            <div id="historyRange" class="range-filter" hidden>
              <span id="rangeLabel"></span>
              <button id="clearRange" type="button" data-i18n="track.clear"></button>
            </div>
            <div class="history-controls">
              <input id="q" type="search" autocomplete="off" data-i18n-label="hist.search">
              <select id="windowOrder" data-i18n-label="hist.view" hidden>
                <option value="grouped" data-i18n="hist.view.grouped"></option>
                <option value="time" data-i18n="hist.view.time"></option>
              </select>
            </div>
            <div class="note-row">
              <div id="tabNote" class="muted small-text"></div>
              <button id="clearClips" class="small" data-i18n="hist.clear" hidden></button>
            </div>
            <div id="list" class="timeline"></div>
          </div>
          <div id="bookmarks" class="timeline" hidden></div>
          <div id="downloads" class="timeline" hidden></div>
        </section>
      </div>

      <div id="systemView" class="view" aria-labelledby="pageTitle" hidden>
        <div class="system-grid">
          <section class="wide" aria-labelledby="sysSpecsTitle">
            <div class="card-heading">
              <h2 id="sysSpecsTitle" data-i18n="system.specs"></h2>
              <span id="sysLiveClock" class="muted small-text"></span>
            </div>
            <div id="sysSpecs" class="cards"></div>
            <div id="sysDisks" class="bars sys-disks"></div>
          </section>
          <section>
            <h2 data-i18n="sec.load"></h2>
            <div id="load" class="cards"></div>
            <div id="loadHours" class="chart"></div>
          </section>
          <section class="wide">
            <h2 data-i18n="sec.net"></h2>
            <div id="net" class="cards"></div>
            <div id="hours" class="chart"></div>
            <div class="muted small-text" data-i18n="net.note"></div>
          </section>
          <section class="wide">
            <h2 data-i18n="sec.procs"></h2>
            <div id="procs"></div>
          </section>
          <section class="wide" data-section="live_procs" aria-labelledby="liveProcsTitle">
            <div class="card-heading">
              <h2 id="liveProcsTitle" data-i18n="system.live_procs"></h2>
              <div class="live-proc-controls">
                <input id="procSearch" type="search" autocomplete="off" data-i18n-label="system.proc_search">
                <select id="procSort" data-i18n-label="system.proc_sort">
                  <option value="cpu" data-i18n="system.sort_cpu"></option>
                  <option value="mem" data-i18n="system.sort_mem"></option>
                </select>
                <button id="procRefresh" class="small" type="button" data-i18n="system.refresh"></button>
              </div>
            </div>
            <div id="liveProcMsg" class="muted small-text"></div>
            <div id="liveProcs" class="live-procs"></div>
          </section>
          <section>
            <h2 data-i18n="sec.health"></h2>
            <div id="health"></div>
          </section>
          <section class="wide" data-section="junk" aria-labelledby="junkTitle">
            <div class="card-heading">
              <h2 id="junkTitle" data-i18n="system.junk_title"></h2>
              <div class="live-proc-controls">
                <select id="junkAge" data-i18n-label="system.junk_age">
                  <option value="24" data-i18n="system.junk_age_24"></option>
                  <option value="1" data-i18n="system.junk_age_1"></option>
                  <option value="0" data-i18n="system.junk_age_0"></option>
                </select>
                <button id="scanJunk" class="small" type="button" data-i18n="system.junk_scan"></button>
                <button id="cleanJunk" class="small danger" type="button" data-i18n="system.junk_clean" hidden></button>
              </div>
            </div>
            <div id="junkMsg" class="muted small-text"></div>
            <div id="junkList"></div>
          </section>
          <section data-section="startup" aria-labelledby="startupTitle">
            <div class="card-heading">
              <h2 id="startupTitle" data-i18n="system.startup_title"></h2>
              <button id="refreshStartup" class="small" type="button" data-i18n="system.refresh"></button>
            </div>
            <div id="startupMsg" class="muted small-text"></div>
            <div id="startupList" class="live-procs"></div>
          </section>
          <section data-section="ports" aria-labelledby="portsTitle">
            <div class="card-heading">
              <h2 id="portsTitle" data-i18n="system.ports_title"></h2>
              <div class="live-proc-controls">
                <input id="portSearch" type="search" autocomplete="off" data-i18n-label="system.port_search">
                <button id="refreshPorts" class="small" type="button" data-i18n="system.refresh"></button>
              </div>
            </div>
            <div id="portsList" class="live-procs"></div>
          </section>
          <section class="wide" data-section="power" aria-labelledby="powerTitle">
            <div class="card-heading">
              <h2 id="powerTitle" data-i18n="system.power_title"></h2>
              <label class="section-toggle">
                <input id="keepAwake" type="checkbox">
                <span data-i18n="system.keep_awake"></span>
              </label>
            </div>
            <p class="muted small-text" data-i18n="system.power_note"></p>
            <div class="power-controls">
              <select id="powerCondition" data-i18n-label="system.power_cond">
                <option value="net_idle" data-i18n="system.cond_net"></option>
                <option value="cpu_idle" data-i18n="system.cond_cpu"></option>
                <option value="timer" data-i18n="system.cond_timer"></option>
              </select>
              <select id="powerDelay" data-i18n-label="system.power_delay">
                <option value="2" data-i18n="system.delay_2"></option>
                <option value="5" data-i18n="system.delay_5"></option>
                <option value="15" data-i18n="system.delay_15"></option>
                <option value="30" data-i18n="system.delay_30"></option>
                <option value="60" data-i18n="system.delay_60"></option>
              </select>
              <select id="powerAction" data-i18n-label="system.power_act">
                <option value="sleep" data-i18n="system.act_sleep"></option>
                <option value="shutdown" data-i18n="system.act_shutdown"></option>
              </select>
              <button id="powerApply" class="small" type="button" data-i18n="system.power_start"></button>
              <button id="powerCancel" class="small danger" type="button" data-i18n="system.power_cancel" hidden></button>
            </div>
            <div id="powerStatus" class="muted small-text"></div>
          </section>
        </div>
      </div>

      <div id="settingsView" class="view" aria-labelledby="pageTitle" hidden>
        <div id="toolMsg" class="settings-feedback muted" role="status"></div>
        <section class="settings-card" aria-labelledby="generalTitle">
          <h2 id="generalTitle" data-i18n="settings.general"></h2>
          <div class="setting-row">
            <label for="lang" data-i18n="lang.label"></label>
            <select id="lang"></select>
          </div>
          <div class="setting-row">
            <label for="themeMode" data-i18n="theme.toggle"></label>
            <select id="themeMode">
              <option value="system" data-i18n="theme.system"></option>
              <option value="light" data-i18n="theme.light"></option>
              <option value="dark" data-i18n="theme.dark"></option>
            </select>
          </div>
          <label class="setting-row">
            <span data-i18n="tools.autostart"></span>
            <input id="autostart" type="checkbox">
          </label>
          <div class="setting-row">
            <label for="breakMinutes" data-i18n="break.label"></label>
            <select id="breakMinutes">
              <option value="0" data-i18n="break.off"></option>
              <option value="45" data-i18n="break.45"></option>
              <option value="60" data-i18n="break.60"></option>
              <option value="90" data-i18n="break.90"></option>
            </select>
          </div>
          <label class="setting-row">
            <span data-i18n="widget.label"></span>
            <input id="widgetToggle" type="checkbox">
          </label>
        </section>
        <section class="settings-card" aria-labelledby="recordingTitle">
          <h2 id="recordingTitle" data-i18n="settings.recording"></h2>
          <form id="idleSettings" class="setting-row">
            <label for="idleMinutes" data-i18n="idle.label"></label>
            <div class="setting-actions">
              <input id="idleMinutes" type="number" min="1" max="60" step="1" required disabled>
              <button id="saveIdle" type="submit" disabled data-i18n="common.save"></button>
            </div>
          </form>
          <form id="recordingSettings">
            <fieldset id="recordingFields" disabled>
              <label class="setting-row">
                <span data-i18n="record.clipboard"></span>
                <input id="recordClipboard" type="checkbox">
              </label>
              <div class="setting-row">
                <label for="retentionDays" data-i18n="record.retention"></label>
                <input id="retentionDays" type="number" min="0" max="3650" required>
              </div>
              <div class="recording-exclusions">
                <label for="excludedApps" data-i18n="record.excluded"></label>
                <textarea id="excludedApps" rows="3" maxlength="4096" aria-describedby="excludedHint"></textarea>
                <div id="excludedHint" class="muted small-text" data-i18n="record.excluded_hint"></div>
              </div>
              <button type="submit" data-i18n="common.save"></button>
            </fieldset>
          </form>
        </section>
        <section class="settings-card" aria-labelledby="dataTitle">
          <h2 id="dataTitle" data-i18n="settings.data"></h2>
          <button id="forget" class="danger" data-i18n="tools.forget"></button>
          <form id="deletePeriod" class="setting-row delete-period">
            <label><span data-i18n="record.from"></span><input id="deleteFrom" type="date" required></label>
            <label><span data-i18n="record.through"></span><input id="deleteThrough" type="date" required></label>
            <button type="submit" class="danger" data-i18n="record.delete"></button>
          </form>
        </section>
        <section class="settings-card" aria-labelledby="categoryRulesTitle">
          <h2 id="categoryRulesTitle" data-i18n="category.rules"></h2>
          <div id="categoryRules"></div>
        </section>
        <section class="settings-card" aria-labelledby="syncTitle">
          <h2 id="syncTitle" tabindex="-1" data-i18n="sync.title"></h2>
          <div id="syncStatus" class="muted" role="status"></div>
          <progress id="syncProgress" class="sync-progress" aria-labelledby="syncTitle" hidden></progress>
          <form id="syncSettings">
            <fieldset id="syncFields" disabled>
              <div class="setting-row">
                <label for="syncDeviceName" data-i18n="sync.device_name"></label>
                <input id="syncDeviceName" type="text" maxlength="64" required>
              </div>
              <div id="syncConnectFields">
                <label class="setting-row">
                  <span data-i18n="sync.history"></span><input id="syncHistory" type="checkbox">
                </label>
                <p class="muted small-text" data-i18n="sync.consent"></p>
              </div>
              <div class="sync-actions">
                <button id="syncConnect" type="submit" class="primary" data-i18n="sync.connect"></button>
                <button id="syncRename" type="submit" data-i18n="common.save" hidden></button>
                <button id="syncNow" type="button" data-i18n="sync.now" hidden></button>
                <button id="syncDisconnect" type="button" data-i18n="sync.disconnect" hidden></button>
              </div>
            </fieldset>
          </form>
          <div id="syncDevices" class="sync-devices"></div>
        </section>
        <section class="settings-card" aria-labelledby="sectionsTitle">
          <h2 id="sectionsTitle" data-i18n="settings.sections"></h2>
          <p class="muted small-text" data-i18n="settings.sections_note"></p>
          <div id="sectionToggles" class="section-toggles"></div>
        </section>
        <section id="updateSettings" class="settings-card" aria-labelledby="updateTitle" hidden>
          <h2 id="updateTitle" tabindex="-1" data-i18n="update.title"></h2>
          <p id="updateStatus" class="muted" role="status"></p>
          <button id="updateCheck" type="button" data-i18n="update.check"></button>
          <button id="updateInstall" type="button" class="primary" data-i18n="update.install" hidden></button>
        </section>
      </div>
    </main>
  </div>

  <dialog id="calendarDlg" aria-labelledby="calendarTitle">
    <div class="card-heading">
      <h3 id="calendarTitle" data-i18n="calendar.title"></h3>
      <form method="dialog"><button type="submit" class="small" data-i18n="common.cancel"></button></form>
    </div>
    <div class="calendar-nav">
      <button id="calendarPrev" type="button" data-i18n-label="calendar.prev">‹</button>
      <strong id="calendarMonth" aria-live="polite"></strong>
      <button id="calendarNext" type="button" data-i18n-label="calendar.next">›</button>
    </div>
    <div id="calendarDays" class="calendar-days"></div>
    <p class="muted small-text" data-i18n="calendar.legend"></p>
  </dialog>

  <dialog id="categoryDlg" aria-labelledby="categoryTitle">
    <form method="dialog">
      <h3 id="categoryTitle" data-i18n="category.edit"></h3>
      <p id="categoryTarget" class="muted"></p>
      <label for="categoryValue" data-i18n="category.label"></label>
      <select id="categoryValue"></select>
      <label for="categoryScope" data-i18n="category.scope"></label>
      <select id="categoryScope">
        <option value="visit" data-i18n="category.visit"></option>
        <option value="window" data-i18n="category.window"></option>
        <option value="app" data-i18n="category.app"></option>
      </select>
      <div class="row">
        <button value="cancel" data-i18n="common.cancel"></button>
        <button value="ok" class="primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="noteDlg">
    <form method="dialog">
      <h3 data-i18n="note.title"></h3>
      <input id="noteText" type="text" data-i18n-placeholder="note.ph" autocomplete="off">
      <div class="row">
        <button value="cancel" data-i18n="common.cancel"></button>
        <button value="ok" class="primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="goalDlg">
    <form method="dialog">
      <h3 data-i18n="goaldlg.title"></h3>
      <select id="goalCat"></select>
      <input id="goalMin" type="number" min="0" step="5" data-i18n-placeholder="goaldlg.ph">
      <div class="row">
        <button value="cancel" data-i18n="common.cancel"></button>
        <button value="ok" class="primary" data-i18n="common.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="clipImageDlg" class="clip-image-dlg">
    <div class="clip-image-dlg-head">
      <span id="clipImageMeta" class="muted small-text"></span>
      <button id="clipImageClose" type="button" class="small">✕</button>
    </div>
    <img id="clipImageFull" alt="">
  </dialog>

  <script src="i18n.js"></script>
  <script src="controls.js"></script>
  <script src="sync.js"></script>
  <script src="updater.js"></script>
  <script src="system.js"></script>
  <script src="history.js"></script>
  <script src="app.js"></script>
</body>
</html>
