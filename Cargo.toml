[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
windows = "0.58"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }

ml-core = { path = "crates/ml-core" }
ml-storage = { path = "crates/ml-storage" }
ml-collector = { path = "crates/ml-collector" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
